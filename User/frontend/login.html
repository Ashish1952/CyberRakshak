<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Rakshak - Authenticate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --theme-primary: #06b6d4;
            --theme-glow: rgba(6, 182, 212, 0.5);
            --theme-bg: rgba(6, 182, 212, 0.05);
            --theme-border: rgba(6, 182, 212, 0.3);
        }

        body.theme-admin {
            --theme-primary: #ef4444;
            --theme-glow: rgba(239, 68, 68, 0.5);
            --theme-bg: rgba(239, 68, 68, 0.05);
            --theme-border: rgba(239, 68, 68, 0.3);
        }

        body.theme-register {
            --theme-primary: #10b981;
            --theme-glow: rgba(16, 185, 129, 0.5);
            --theme-bg: rgba(16, 185, 129, 0.05);
            --theme-border: rgba(16, 185, 129, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            /* Allow vertical scrolling on small devices, hide horizontal overflow */
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-font-smoothing: antialiased;
        }

        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }

        /* Dynamic Theme Classes */
        .text-theme { color: var(--theme-primary); transition: color 0.6s ease; }
        .bg-theme { background-color: var(--theme-primary); transition: background-color 0.6s ease; }
        .border-theme { border-color: var(--theme-border); transition: border-color 0.6s ease; }
        .shadow-theme { box-shadow: 0 0 20px var(--theme-glow); transition: box-shadow 0.6s ease; }
        .focus-ring-theme:focus-within { box-shadow: 0 0 0 2px var(--theme-glow); border-color: var(--theme-primary); }
        .fill-theme-bg { background: linear-gradient(135deg, var(--theme-bg), transparent); transition: background 0.6s ease; }

        /* Advanced Background Animations - Fixed for scrolling reliability */
        .cyber-grid {
            position: fixed; /* Changed to fixed so it stays during scroll */
            width: 200vw;
            height: 200vh;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 15s linear infinite;
            pointer-events: none;
            z-index: -2;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        .ambient-orb {
            position: fixed; /* Fixed to prevent layout stretching */
            width: 50vw;
            height: 50vw;
            max-width: 400px;
            max-height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--theme-glow) 0%, transparent 70%);
            filter: blur(40px);
            animation: float 10s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
            transition: background 0.6s ease;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5%, -10%) scale(1.1); }
            66% { transform: translate(-5%, 10%) scale(0.9); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000px); }
        }
        .animate-scanline { animation: scanline 4s linear infinite; }

        /* Form & Input Interactions */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            transition: all 0.3s ease;
        }
        .input-wrapper i {
            color: #475569;
            transition: all 0.3s ease;
        }
        .input-wrapper:focus-within i {
            color: var(--theme-primary);
            text-shadow: 0 0 10px var(--theme-glow);
        }
        /* Fix auto-fill styles in webkit */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0f172a inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-cyber {
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .btn-cyber::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }
        .btn-cyber:hover::before {
            left: 100%;
        }
        .btn-cyber:hover {
            box-shadow: 0 0 30px var(--theme-glow);
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        /* Active touch state for mobile */
        .btn-cyber:active {
            transform: scale(0.98);
        }

        /* Staggered Entry Animation for Form Switch */
        .form-content { transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-group { opacity: 0; transform: translateY(10px); animation: slideUp 0.4s forwards; }
        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.15s; }
        .input-group:nth-child(3) { animation-delay: 0.2s; }
        .input-group:nth-child(4) { animation-delay: 0.25s; }
        .input-group:nth-child(5) { animation-delay: 0.3s; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        #alert-box { transition: all 0.3s ease; opacity: 0; transform: translateY(-10px); display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased select-none relative">

    <!-- Fixed Ambient Backgrounds -->
    <div class="ambient-orb top-[-10%] right-[-5%]"></div>
    <div class="ambient-orb bottom-[-10%] left-[-10%] opacity-50"></div>
    <div class="cyber-grid"></div>

    <div class="w-full flex flex-col lg:flex-row z-10 min-h-screen relative flex-1">
        
        <!-- Left Side: Branding & Image (Hidden on Mobile, Visible on Desktop) -->
        <div class="hidden lg:flex lg:w-1/2 xl:w-7/12 relative items-center justify-center p-8 xl:p-12">
            <div class="absolute inset-0 fill-theme-bg z-0 border-r border-theme"></div>
            
            <div class="relative w-full max-w-2xl h-[85vh] rounded-3xl overflow-hidden border-theme border glass-panel shadow-theme group">
                <img src="https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?q=80&w=2070&auto=format&fit=crop" 
                     class="object-cover w-full h-full opacity-40 mix-blend-luminosity group-hover:scale-105 group-hover:opacity-60 transition-all duration-1000" alt="Cyber Rakshak Facility">
                
                <div class="absolute top-0 left-0 w-full h-[2px] bg-theme shadow-theme animate-scanline opacity-80"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                
                <div class="absolute bottom-10 left-10 right-10">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="p-3 rounded-xl border border-theme bg-slate-950/80 shadow-theme">
                            <i data-lucide="shield-check" class="w-8 h-8 text-theme"></i>
                        </div>
                        <div class="h-px flex-1 bg-gradient-to-r from-theme to-transparent opacity-50"></div>
                    </div>
                    <h1 class="text-4xl xl:text-6xl font-black text-white tracking-widest mb-2 font-cyber leading-tight">
                        CYBER<br><span class="text-theme">RAKSHAK</span>
                    </h1>
                    <p id="hud-subtitle" class="text-slate-400 text-xs xl:text-sm font-mono tracking-widest uppercase flex items-center gap-2">
                        <i data-lucide="radar" class="w-4 h-4 animate-pulse text-theme"></i> 
                        <span id="hud-text">Citizen Reporting Terminal</span>
                    </p>
                    
                    <div class="mt-8 flex flex-wrap items-center gap-3 xl:gap-4 text-[10px] xl:text-xs font-mono text-slate-400 border border-slate-800 bg-slate-950/60 p-3 rounded-lg backdrop-blur-md w-fit">
                        <div class="flex items-center gap-2 text-theme">
                            <div class="w-2 h-2 rounded-full bg-theme shadow-theme animate-pulse"></div>
                            UPLINK SECURE
                        </div>
                        <div class="h-3 w-px bg-slate-700 hidden sm:block"></div>
                        <div>AES-256-GCM</div>
                        <div class="h-3 w-px bg-slate-700 hidden sm:block"></div>
                        <div>NODE: IND-01</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Interactive Form Container -->
        <div class="w-full lg:w-1/2 xl:w-5/12 flex items-center justify-center p-4 sm:p-8 lg:p-12 relative z-20 min-h-screen lg:min-h-0 py-8 lg:py-0">
            <div class="w-full max-w-md sm:max-w-lg lg:max-w-md mx-auto">
                
                <!-- Mobile Header -->
                <div class="lg:hidden text-center mb-8 flex flex-col items-center pt-4">
                    <div class="p-3 rounded-2xl border border-theme bg-slate-900/50 shadow-theme mb-4 backdrop-blur-sm">
                        <i data-lucide="shield-check" class="w-10 h-10 text-theme drop-shadow-[0_0_10px_var(--theme-primary)]"></i>
                    </div>
                    <h1 class="text-3xl sm:text-4xl font-black text-white tracking-widest font-cyber">CYBER<span class="text-theme">RAKSHAK</span></h1>
                    <p class="text-slate-400 text-xs font-mono tracking-widest uppercase mt-2" id="mobile-hud-text">Citizen Portal</p>
                </div>

                <!-- Form Panel -->
                <div id="form-container" class="form-content glass-panel rounded-[2rem] p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-theme opacity-70 shadow-theme"></div>

                    <!-- Header -->
                    <div class="flex items-center gap-4 mb-8">
                        <div class="p-3 rounded-xl bg-slate-900 border border-theme shadow-theme shrink-0">
                            <i id="header-icon" data-lucide="user" class="w-6 h-6 text-theme"></i>
                        </div>
                        <div>
                            <h2 id="form-title" class="text-xl sm:text-2xl font-bold text-white font-cyber tracking-wide">Citizen Login</h2>
                            <p id="form-desc" class="text-[11px] sm:text-xs text-slate-400 font-mono mt-1">Authenticate identity to proceed</p>
                        </div>
                    </div>

                    <!-- Alert Box -->
                    <div id="alert-box" class="bg-red-950/50 border border-red-500/50 text-red-200 text-xs p-3.5 rounded-xl mb-6 flex items-start gap-3 font-mono shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                        <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5 text-red-400"></i>
                        <span id="alert-message"></span>
                    </div>

                    <!-- Authentication Form -->
                    <form id="auth-form" class="space-y-4 sm:space-y-5 relative">
                        <input type="hidden" id="view-state" name="view" value="user-login">

                        <div data-show="user-register" class="input-group hidden">
                            <label class="block mb-1.5 text-[10px] sm:text-[11px] font-cyber uppercase tracking-widest text-theme">Full Legal Name</label>
                            <div class="relative input-wrapper border border-slate-700/50 rounded-xl bg-slate-900/60 focus-ring-theme">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                    <i data-lucide="user-circle" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                                </div>
                                <input type="text" name="full_name" class="w-full bg-transparent text-slate-100 text-sm block p-3.5 pl-11 sm:pl-12 outline-none" placeholder="John Doe">
                            </div>
                        </div>

                        <div class="input-group block">
                            <label class="block mb-1.5 text-[10px] sm:text-[11px] font-cyber uppercase tracking-widest text-theme">Network Email</label>
                            <div class="relative input-wrapper border border-slate-700/50 rounded-xl bg-slate-900/60 focus-ring-theme">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                    <i data-lucide="mail" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                                </div>
                                <input type="email" name="email" required class="w-full bg-transparent text-slate-100 text-sm block p-3.5 pl-11 sm:pl-12 outline-none" placeholder="citizen@domain.com">
                            </div>
                        </div>

                        <div data-show="user-register" class="input-group hidden">
                            <label class="block mb-1.5 text-[10px] sm:text-[11px] font-cyber uppercase tracking-widest text-theme">Secure Mobile</label>
                            <div class="relative input-wrapper border border-slate-700/50 rounded-xl bg-slate-900/60 focus-ring-theme">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                    <i data-lucide="smartphone" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                                </div>
                                <input type="tel" name="mobile" class="w-full bg-transparent text-slate-100 text-sm block p-3.5 pl-11 sm:pl-12 outline-none" placeholder="+91 98765 43210">
                            </div>
                        </div>

                        <div class="input-group block">
                            <label id="password-label" class="block mb-1.5 text-[10px] sm:text-[11px] font-cyber uppercase tracking-widest text-theme">Access Password</label>
                            <div class="relative input-wrapper border border-slate-700/50 rounded-xl bg-slate-900/60 focus-ring-theme">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                    <i data-lucide="lock-keyhole" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                                </div>
                                <input type="password" name="password" required class="w-full bg-transparent text-slate-100 text-sm block p-3.5 pl-11 sm:pl-12 outline-none" placeholder="••••••••">
                            </div>
                        </div>

                        <!-- Adaptive Captcha Block -->
                        <div data-show="user-login admin-login" class="input-group block pt-2">
                            <label class="block mb-1.5 text-[10px] sm:text-[11px] font-cyber tracking-widest uppercase text-slate-400">Integrity Check</label>
                            <div class="flex items-center gap-2 sm:gap-3">
                                <div class="bg-slate-900/80 border border-slate-700/50 px-3 py-3 sm:px-4 rounded-xl text-slate-300 font-mono tracking-widest flex-1 flex items-center justify-center gap-2">
                                    <i data-lucide="fingerprint" class="w-4 h-4 sm:w-5 sm:h-5 text-theme opacity-80"></i>
                                    <span id="captcha-eq" class="font-bold text-xs sm:text-sm"></span>
                                </div>
                                <div class="relative input-wrapper border border-slate-700/50 rounded-xl bg-slate-900/60 focus-ring-theme w-20 sm:w-24 shrink-0">
                                     <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="captcha-input" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full bg-transparent text-white text-center text-sm block p-3 sm:p-3.5 outline-none font-mono" placeholder="Ans">
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-4 sm:pt-6 input-group block">
                            <button type="submit" class="btn-cyber w-full text-slate-950 bg-theme font-cyber font-bold tracking-widest rounded-xl text-sm sm:text-base px-5 py-3.5 sm:py-4 text-center transition-all duration-300 flex justify-center items-center gap-2">
                                <span id="submit-btn-text">ESTABLISH LINK</span>
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Dynamic Toggles Footer -->
                    <div class="mt-6 sm:mt-8 pt-5 sm:pt-6 border-t border-slate-800/80 flex flex-col gap-3 sm:gap-4 text-[11px] sm:text-xs font-mono tracking-wide" id="toggle-footer">
                        <!-- Footer populated via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Interactive Logic Script -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        let currentView = 'user-login';
        let captchaAns = 0;

        // DOM Elements
        const ui = {
            container: document.getElementById('form-container'),
            title: document.getElementById('form-title'),
            desc: document.getElementById('form-desc'),
            icon: document.getElementById('header-icon'),
            hud: document.getElementById('hud-text'),
            mobileHud: document.getElementById('mobile-hud-text'),
            viewState: document.getElementById('view-state'),
            submitText: document.getElementById('submit-btn-text'),
            passLabel: document.getElementById('password-label'),
            footer: document.getElementById('toggle-footer'),
            alertBox: document.getElementById('alert-box'),
            alertMsg: document.getElementById('alert-message'),
            captchaEq: document.getElementById('captcha-eq'),
            captchaInput: document.getElementById('captcha-input'),
            form: document.getElementById('auth-form')
        };

        function generateCaptcha() {
            const n1 = Math.floor(Math.random() * 10) + 1;
            const n2 = Math.floor(Math.random() * 10) + 1;
            captchaAns = n1 + n2;
            ui.captchaEq.innerHTML = `${n1} <span class="text-slate-500 font-normal">+</span> ${n2} <span class="text-slate-500 font-normal">=</span> ?`;
            ui.captchaInput.value = '';
        }

        function showAlert(msg, isSuccess = false) {
            ui.alertMsg.innerText = msg;
            ui.alertBox.className = isSuccess 
                ? 'bg-emerald-950/50 border border-emerald-500/50 text-emerald-200 text-xs p-3.5 rounded-xl mb-6 flex items-start gap-3 font-mono shadow-[0_0_15px_rgba(16,185,129,0.2)]'
                : 'bg-red-950/50 border border-red-500/50 text-red-200 text-xs p-3.5 rounded-xl mb-6 flex items-start gap-3 font-mono shadow-[0_0_15px_rgba(239,68,68,0.2)]';
            
            ui.alertBox.innerHTML = isSuccess 
                ? `<i data-lucide="check-circle" class="w-4 h-4 shrink-0 mt-0.5 text-emerald-400"></i><span id="alert-message">${msg}</span>`
                : `<i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5 text-red-400"></i><span id="alert-message">${msg}</span>`;
            
            lucide.createIcons();
            ui.alertBox.style.display = 'flex';
            setTimeout(() => {
                ui.alertBox.style.opacity = '1';
                ui.alertBox.style.transform = 'translateY(0)';
            }, 10);
        }

        function hideAlert() {
            ui.alertBox.style.opacity = '0';
            ui.alertBox.style.transform = 'translateY(-10px)';
            setTimeout(() => ui.alertBox.style.display = 'none', 300);
        }

        function switchView(view) {
            // Smooth Animate Out
            ui.container.style.opacity = '0';
            ui.container.style.transform = 'scale(0.97) translateY(10px)';
            hideAlert();
            ui.form.reset();

            setTimeout(() => {
                currentView = view;
                ui.viewState.value = view;
                
                // Theme Shifting
                document.body.className = 'min-h-screen flex flex-col antialiased select-none relative';
                if (view === 'admin-login') document.body.classList.add('theme-admin');
                if (view === 'user-register') document.body.classList.add('theme-register');

                // Trigger Input Group Staggered CSS Animations
                document.querySelectorAll('.input-group').forEach(el => {
                    el.style.animation = 'none'; 
                    el.offsetHeight; 
                    el.style.animation = null; 
                });

                // Toggle visibility based on state
                document.querySelectorAll('[data-show]').forEach(el => {
                    const views = el.getAttribute('data-show').split(' ');
                    const inputs = el.querySelectorAll('input');
                    if (views.includes(view)) {
                        el.classList.remove('hidden');
                        el.classList.add('block');
                        inputs.forEach(inp => inp.required = true);
                    } else {
                        el.classList.add('hidden');
                        el.classList.remove('block');
                        inputs.forEach(inp => inp.required = false);
                    }
                });

                // Update Contextual UI Content
                if (view === 'user-login') {
                    ui.title.innerText = 'Citizen Login';
                    ui.desc.innerText = 'Authenticate identity to proceed';
                    ui.submitText.innerText = 'ESTABLISH LINK';
                    ui.passLabel.innerText = 'Access Password';
                    ui.hud.innerText = 'Citizen Reporting Terminal';
                    ui.mobileHud.innerText = 'Citizen Portal';
                    ui.icon.setAttribute('data-lucide', 'user');
                    ui.footer.innerHTML = `
                        <div class="flex flex-col sm:flex-row justify-between items-center sm:items-center text-slate-400 gap-2 sm:gap-0">
                            <span>Require elevated access?</span>
                            <button type="button" onclick="switchView('admin-login')" class="text-red-400 hover:text-red-300 hover:drop-shadow-[0_0_8px_rgba(239,68,68,0.8)] transition-all flex items-center gap-1 font-bold"><i data-lucide="shield-alert" class="w-3.5 h-3.5"></i> Officer Login</button>
                        </div>
                        <div class="flex flex-col sm:flex-row justify-between items-center sm:items-center text-slate-400 gap-2 sm:gap-0">
                            <span>Unregistered citizen?</span>
                            <button type="button" onclick="switchView('user-register')" class="text-[#10b981] hover:text-emerald-300 hover:drop-shadow-[0_0_8px_rgba(16,185,129,0.8)] transition-all font-bold">Register Node</button>
                        </div>
                    `;
                } else if (view === 'admin-login') {
                    ui.title.innerText = 'Officer Login';
                    ui.desc.innerText = 'Restricted Law Enforcement Access';
                    ui.submitText.innerText = 'GRANT ACCESS';
                    ui.passLabel.innerText = 'Clearance Code';
                    ui.hud.innerText = 'Law Enforcement Terminal';
                    ui.mobileHud.innerText = 'Officer Portal';
                    ui.icon.setAttribute('data-lucide', 'shield-alert');
                    ui.footer.innerHTML = `
                        <div class="flex flex-col sm:flex-row justify-between items-center sm:items-center text-slate-400 gap-2 sm:gap-0">
                            <span>Return to public portal?</span>
                            <button type="button" onclick="switchView('user-login')" class="text-[#06b6d4] hover:text-cyan-300 hover:drop-shadow-[0_0_8px_rgba(6,182,212,0.8)] transition-all flex items-center gap-1 font-bold"><i data-lucide="user" class="w-3.5 h-3.5"></i> Citizen Login</button>
                        </div>
                    `;
                } else if (view === 'user-register') {
                    ui.title.innerText = 'Citizen Registry';
                    ui.desc.innerText = 'Initialize secure reporting node';
                    ui.submitText.innerText = 'INITIALIZE NODE';
                    ui.passLabel.innerText = 'Initialize Password';
                    ui.hud.innerText = 'New Identity Registration';
                    ui.mobileHud.innerText = 'Registration Portal';
                    ui.icon.setAttribute('data-lucide', 'user-plus');
                    ui.footer.innerHTML = `
                        <div class="flex flex-col sm:flex-row justify-between items-center sm:items-center text-slate-400 gap-2 sm:gap-0">
                            <span>Already established link?</span>
                            <button type="button" onclick="switchView('user-login')" class="text-[#06b6d4] hover:text-cyan-300 hover:drop-shadow-[0_0_8px_rgba(6,182,212,0.8)] transition-all font-bold">Return to Login</button>
                        </div>
                    `;
                }

                // Captcha Logic
                if (view.includes('login')) {
                    generateCaptcha();
                    ui.captchaInput.required = true;
                } else {
                    ui.captchaInput.required = false;
                }

                lucide.createIcons();

                // Smooth Animate In
                ui.container.style.opacity = '1';
                ui.container.style.transform = 'scale(1) translateY(0)';
            }, 400);
        }

        // Boot Init
        switchView('user-login');

        // Main Submit Handler
        ui.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            // Validate Captcha Client-Side
            if (currentView.includes('login') && parseInt(ui.captchaInput.value) !== captchaAns) {
                showAlert("INTEGRITY CHECK FAILED: Invalid numerical sequence.");
                generateCaptcha();
                return;
            }

            const formData = new FormData(e.target);
            const payload = Object.fromEntries(formData.entries());

            try {
                // Update this URL to match your PHP backend location
                const response = await fetch('http://localhost/cybercrime-portal/backend/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, true);
                    if (currentView === 'user-register') {
                        setTimeout(() => switchView('user-login'), 2000);
                    } else {
                        // Store user session data locally to persist login
                        localStorage.setItem('userEmail', result.user.email);
                        localStorage.setItem('userName', result.user.full_name);
                        localStorage.setItem('userRole', result.user.role);

                        // Redirect to Home Page (home.html)
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 1000);
                    }
                } else {
                    showAlert("AUTH FAILED: " + result.message);
                    if (currentView.includes('login')) generateCaptcha();
                }
            } catch (error) {
                showAlert("UPLINK FAILED: Backend server unreachable. Check connection.");
            }
        });
    </script>
</body>
</html>
